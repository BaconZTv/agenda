<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1B1C1E"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black"><meta name="apple-mobile-web-app-title" content="AGENDA">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="icon-192.png">
<title>AGENDA</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
[hidden]{display:none!important}
html{color-scheme:light}
body{margin:0}
img{max-width:100%}
 
:root{
  --bg:#F3F2EF; --surface:#FFFFFF; --sunken:#ECEAE6; --fg:#1E2124; --muted:#666B70; --line:#D9D6D0;
  --navy:#042433; --priv:#E97132; --priv-ink:#1E1205; --pub:#FFC000; --pub-ink:#1F1800;
  --danger:#B3261E; --ok:#2E7D4F; --warn:#9A5B00; --focus:#2F6FDB;
  --accent:var(--priv); --accent-ink:var(--priv-ink);
  --font:AptosEmb,"Segoe UI",system-ui,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17191B; --surface:#212427; --sunken:#1B1D20; --fg:#ECEDEE; --muted:#A3A8AD; --line:#363A3F;
  --danger:#F2867E; --ok:#7BC49A; --warn:#F0B35A; --focus:#7FA8F0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17191B; --surface:#212427; --sunken:#1B1D20; --fg:#ECEDEE; --muted:#A3A8AD; --line:#363A3F;
  --danger:#F2867E; --ok:#7BC49A; --warn:#F0B35A; --focus:#7FA8F0; color-scheme:dark}
body[data-tipo="publica"]{--accent:var(--pub); --accent-ink:var(--pub-ink)}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.4;padding-inline:16px;padding-block:0 40px}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:1880px;margin-inline:auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-block:14px;border-bottom:1px solid var(--line)}
h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.01em;margin-right:auto}
.field-inline{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.field-inline input{font-size:15px;text-transform:none;letter-spacing:0;color:var(--fg);font-weight:400}
input[type=date],input[type=time],input[type=text],input[type=url]{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:40px;width:100%}
input[type=date]{width:auto}
select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 6px;min-height:40px;font:inherit;color:inherit;min-width:0}
.hsel{display:grid;grid-template-columns:1fr 1fr 1.1fr;gap:4px}
.seg{display:inline-flex;background:var(--sunken);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;border-radius:999px;padding:7px 16px;font-weight:700;font-size:13px;letter-spacing:.06em;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"][data-v="privada"]{background:var(--priv);color:var(--priv-ink)}
.seg button[aria-pressed="true"][data-v="publica"]{background:var(--pub);color:var(--pub-ink)}
.status{font-size:12px;color:var(--muted);min-width:90px;text-align:right}
.status.err{color:var(--danger)}
.shell{display:grid;grid-template-columns:220px minmax(0,1fr);gap:24px;margin-top:20px;align-items:start}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:1240px){.grid{grid-template-columns:minmax(0,1fr)}}
@media (max-width:820px){.shell{grid-template-columns:minmax(0,1fr)}}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px);max-height:calc(100vh - 110px);overflow:auto;display:flex;flex-direction:column;gap:6px}
@media (max-width:820px){.side{position:static;max-height:none}}
.side h2{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 4px}
.side details>summary{cursor:pointer;list-style:none}
.side details>summary::-webkit-details-marker{display:none}
.side summary h2::after{content:"  ▾ mostrar"}
.side details[open] summary h2::after{content:"  ▴ ocultar"}
@media (min-width:821px){.side summary{pointer-events:none}.side summary h2::after{content:none!important}}
.day{display:flex;flex-direction:column;gap:4px;padding:8px 10px;border-radius:8px;border:1px solid transparent}
.day.sel{background:var(--surface);border-color:var(--line)}
.day .d{font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
.day .d small{font-weight:400;color:var(--muted);margin-left:4px}
.day .t{display:flex;gap:6px;flex-wrap:wrap}
.tag{border:1px solid var(--line);background:transparent;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:700;letter-spacing:.05em;cursor:pointer;color:var(--muted)}
.tag .n{font-variant-numeric:tabular-nums;opacity:.8;margin-left:3px}
.tag[data-v="privada"].on{background:var(--priv);border-color:var(--priv);color:var(--priv-ink)}
.tag[data-v="publica"].on{background:var(--pub);border-color:var(--pub);color:var(--pub-ink)}
.tag.cur{outline:2px solid var(--fg);outline-offset:1px}
.side .none{font-size:13px;color:var(--muted);padding:8px 2px}
.today{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;font-weight:700;font-size:13px;cursor:pointer;text-align:left}
.list{display:flex;flex-direction:column;gap:12px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:28px 20px;text-align:center;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:10px;grid-template-columns:200px minmax(0,1fr)}
.card.bad{border-color:var(--danger)}
.card .full{grid-column:1/-1}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
@media (max-width:560px){.card{grid-template-columns:minmax(0,1fr)}.row2{grid-template-columns:minmax(0,1fr)}}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f>span{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
input.up{text-transform:uppercase}
.hint{font-size:12px;color:var(--muted);margin-top:-4px}
.hint .ok{color:var(--ok);font-weight:700}
.hint .warn{color:var(--warn);font-weight:700}
.foot{display:flex;flex-wrap:wrap;align-items:center;gap:8px;justify-content:space-between}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--sunken);border-radius:999px;padding:5px 12px 5px 8px;cursor:pointer;font-size:13px;font-weight:700;color:var(--muted)}
.chip svg{width:18px;height:18px;opacity:.45}
.chip[aria-pressed="true"]{background:var(--surface);border-color:var(--fg);color:var(--fg)}
.chip[aria-pressed="true"] svg{opacity:1}
.del{border:0;background:transparent;color:var(--muted);font-size:13px;cursor:pointer;padding:6px 8px;border-radius:6px}
.del:hover{color:var(--danger)}
.del.confirm{color:var(--danger);font-weight:700}
.add{border:1.5px dashed var(--line);background:transparent;border-radius:var(--r);padding:14px;font-weight:700;cursor:pointer;color:var(--fg)}
.add:hover{border-color:var(--fg)}
aside{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px);display:flex;flex-direction:column;gap:12px}
@media (max-width:1240px){aside{position:static}}
.paper{background:#fff;border:1px solid var(--line);border-radius:6px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.paper svg{display:block;width:100%;height:auto}
.cap{font-size:12px;color:var(--muted)}
.primary{border:1.5px solid var(--navy);background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:16px;border-radius:10px;padding:14px 18px;cursor:pointer;letter-spacing:.02em}
.primary:disabled{opacity:.6;cursor:progress}
.msg{font-size:13px;min-height:1.2em}
.msg.err{color:var(--danger)} .msg.ok{color:var(--ok)}
.modal[hidden]{display:none}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.dialog{background:var(--surface);border-radius:14px;max-width:560px;width:100%;max-height:85vh;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.dialog h2{margin:0;font-size:18px}
.fix{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;align-items:start;padding:10px;border:1px solid var(--line);border-radius:8px}
.fix .k{font-size:11px;font-weight:700;letter-spacing:.07em;color:var(--muted);text-transform:uppercase}
.fix del{color:var(--muted)} .fix ins{text-decoration:none;font-weight:700}
.actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.ghost{border:1px solid var(--line);background:transparent;border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:700}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding-block:24px}
.lbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px 24px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:16px}
.lbox h1{font-size:20px;margin:0}
.lbox input{font-size:22px;letter-spacing:.3em;text-align:center}
.lmark{display:flex;gap:6px}.lmark span{width:28px;height:6px;border-radius:3px}

.fatal{position:sticky;top:0;z-index:30;background:#B3261E;color:#fff;font-weight:700;padding:10px 16px;font-size:14px}

.f>label>span{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.f>label{display:flex;flex-direction:column}
.hint:empty{display:none}
.hint .vok{color:var(--ok);font-weight:700}
.hint .vpend{display:block;color:var(--warn)}
.hint .vacts{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.vbtn{display:inline-flex;align-items:center;border:1px solid var(--line);background:var(--sunken);color:var(--fg);font:700 13px/1.2 var(--font);border-radius:999px;padding:8px 14px;cursor:pointer;text-decoration:none}
.vbtn.ok{border-color:var(--ok);color:var(--ok)}
.linkbtn{border:0;background:none;color:var(--muted);text-decoration:underline;font:inherit;font-size:12px;cursor:pointer;padding:0 4px}
.ubirow{display:flex;gap:8px;align-items:stretch}
.ubirow input{flex:1;min-width:0}
.mapbtn{flex:none;border:1px solid var(--line);background:var(--sunken);color:var(--fg);font-weight:700;font-size:13px;border-radius:8px;padding:0 12px;cursor:pointer}
.mapbtn:hover{border-color:var(--fg)}
body.lock{overflow:hidden}
.mapmodal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:25;display:flex;align-items:center;justify-content:center;padding:16px}
.mapbox{background:var(--surface);border-radius:14px;width:100%;max-width:880px;height:min(92vh,760px);display:flex;flex-direction:column;overflow:hidden}
.maphead{padding:16px 16px 8px;display:flex;flex-direction:column;gap:10px}
.maphead h2{margin:0;font-size:18px}
.mapsearch{display:flex;gap:8px}
.mapsearch input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:42px;font:inherit;color:inherit}
.mapsearch .primary{padding:8px 16px;font-size:15px}
.mapres{display:flex;flex-direction:column;gap:6px;max-height:150px;overflow:auto}
.mapopt{text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:8px;padding:8px 10px;font-size:13px;cursor:pointer}
.mapopt.on{border-color:var(--fg);font-weight:700}
.mapopt em{color:var(--muted);font-style:normal}
.mapwrap{position:relative;flex:1;min-height:240px}
#mapdiv{position:absolute;inset:0}
.maplayers{position:absolute;top:10px;right:10px;z-index:500;display:flex;background:#fff;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.3);overflow:hidden}
.maplayers button{border:0;background:#fff;color:#222;font:700 12px/1 var(--font);padding:8px 10px;cursor:pointer}
.maplayers button[aria-pressed="true"]{background:#222;color:#fff}
.mapfoot{padding:10px 16px 16px;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line)}
@media (max-width:600px){.mapmodal{padding:0}.mapbox{height:100%;max-width:none;border-radius:0}.ubirow{flex-wrap:wrap}.mapbtn{padding:10px 12px}}
.acts{display:flex;flex-wrap:wrap;gap:4px;align-items:center;justify-content:flex-end}
.dup{border:1px solid var(--line);background:transparent;color:var(--fg);font-size:13px;font-weight:700;cursor:pointer;padding:6px 12px;border-radius:999px}
.dup:hover{border-color:var(--fg)}
.dup:disabled{opacity:.6;cursor:progress}
.drive{font-size:14px;font-weight:700;color:var(--fg);text-decoration:underline;text-underline-offset:3px;background:none;border:0;padding:4px 0;cursor:pointer;text-align:left}
</style>

<div class="login" id="login" hidden>
  <form class="lbox" id="lform" autocomplete="off">
    <div class="lmark" aria-hidden="true"><span style="background:var(--priv)"></span><span style="background:var(--pub)"></span></div>
    <h1 style="margin:0">AGENDA</h1>
    <label class="f" for="pin"><span>PIN de acceso</span><input type="password" id="pin" inputmode="numeric" autocomplete="current-password" required></label>
    <button type="submit" class="primary" id="lbtn">Entrar</button>
    <div class="msg err" id="lmsg" aria-live="polite"></div>
  </form>
</div>

<div class="wrap" id="app" hidden>
  <header class="top">
    <h1>AGENDA</h1>
    <label class="field-inline" for="fecha">Fecha <input type="date" id="fecha"></label>
    <div class="seg" role="group" aria-label="Tipo de agenda">
      <button type="button" data-v="privada" aria-pressed="true" id="tipo-privada">PRIVADA</button>
      <button type="button" data-v="publica" aria-pressed="false" id="tipo-publica">PÚBLICA</button>
    </div>
    <span class="status" id="status" aria-live="polite"></span>
  </header>

  <div class="shell">
  <nav class="side" aria-label="Agendas guardadas">
    <details id="side-d" open><summary><h2>Agendas guardadas</h2></summary>
      <div style="display:flex;flex-direction:column;gap:6px;margin-top:6px">
        <button type="button" class="today" id="go-tomorrow">Ir a mañana</button>
        <div id="days"><div class="none">Cargando…</div></div>
      </div>
    </details>
  </nav>
  <div class="grid">
    <section aria-label="Eventos">
      <div class="list" id="list"></div>
      <button type="button" class="add" id="add" style="width:100%;margin-top:12px">+ Agregar evento</button>
    </section>
    <aside>
      <button type="button" class="primary" id="go">Revisar ortografía y descargar PDF</button>
      <div class="msg" id="msg" aria-live="polite"></div>
      <button type="button" class="drive" id="drive" hidden>¿No se descargó? Toca aquí para abrir el PDF</button>
      <div class="paper" id="paper"></div>
      <div class="cap">Así saldrá la hoja. Los eventos se ordenan solos por hora.</div>
    </aside>
  </div>
  </div>
</div>

<div class="mapmodal" id="mapmodal" hidden>
  <div class="mapbox" role="dialog" aria-modal="true" aria-labelledby="mapt">
    <div class="maphead">
      <h2 id="mapt">Buscar lugar</h2>
      <form class="mapsearch" id="mapform" autocomplete="off">
        <input type="search" id="mapq" placeholder="Nombre del lugar o dirección (ej. Tec de Monterrey)">
        <button type="submit" class="primary" id="mapgo">Buscar</button>
      </form>
      <div class="mapres" id="mapres"></div>
    </div>
    <div class="mapwrap"><div id="mapdiv"></div>
      <div class="maplayers"><button type="button" data-capa="calles" aria-pressed="true">Calles</button><button type="button" data-capa="sat" aria-pressed="false">Satélite</button></div>
    </div>
    <div class="mapfoot">
      <div class="cap" id="mapsel">Busca el lugar o toca el mapa para poner el pin. Puedes arrastrar el pin para ajustarlo.</div>
      <div class="actions">
        <button type="button" class="ghost" id="mapcancel">Cancelar</button>
        <button type="button" class="primary" id="mapuse" disabled>Usar esta ubicación</button>
      </div>
    </div>
  </div>
</div>

<div class="modal" id="modal" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="mtitle">
    <h2 id="mtitle">Correcciones de ortografía</h2>
    <div class="cap">Desmarca las que no quieras aplicar.</div>
    <div id="fixes" style="display:flex;flex-direction:column;gap:8px"></div>
    <div class="actions">
      <button type="button" class="ghost" id="m-cancel">Cancelar</button>
      <button type="button" class="ghost" id="m-skip">Descargar sin cambios</button>
      <button type="button" class="primary" id="m-apply">Aplicar y descargar</button>
    </div>
  </div>
</div>

let sincronizando = false;

function cargar() {
  const n = ++cargaN, fecha = state.fecha, tipo = state.tipo, t0 = Date.now();

  }, 8000);

const DIA3 = ["DOM", "LUN", "MAR", "MIÉ", "JUE", "VIE", "SÁB"], MES3 = ["ENE", "FEB", "MAR", "ABR", "MAY", "JUN", "JUL", "AGO", "SEP", "OCT", "NOV", "DIC"];

const ACENTOS = {};
("REUNIÓN GRABACIÓN SESIÓN REVISIÓN PRESENTACIÓN INAUGURACIÓN COMISIÓN CAPACITACIÓN GESTIÓN ATENCIÓN ORGANIZACIÓN COORDINACIÓN " +

 "PÚBLICA PÚBLICO MÉDICO MÚSICA TELÉFONO CÁMARA DÍA MAÑANA AUDITORÍA SECRETARÍA DIRECCIÓN JARDÍN NIÑOS NIÑAS " +
 "HÉCTOR ANDRÉS FÉLIX JOSÉ MARÍA JESÚS RAMÓN RAÚL ÁNGEL MARTÍN JULIÁN SEBASTIÁN ADRIÁN IVÁN RUBÉN RENÉ NOÉ MOISÉS ÓSCAR " +
 "VÍCTOR CÉSAR HERNÁN GERMÁN SIMÓN JOAQUÍN AGUSTÍN TOMÁS NICOLÁS ROCÍO MÓNICA VERÓNICA SOFÍA LUCÍA ESTEFANÍA ROSALÍA INÉS " +
 "GARCÍA LÓPEZ PÉREZ GONZÁLEZ RODRÍGUEZ HERNÁNDEZ MARTÍNEZ SÁNCHEZ RAMÍREZ GÓMEZ DÍAZ VÁZQUEZ JIMÉNEZ GUTIÉRREZ FERNÁNDEZ " +
 "ÁLVAREZ MÉNDEZ CHÁVEZ NÚÑEZ LIZÁRRAGA VELÁZQUEZ DOMÍNGUEZ MÁRQUEZ BENÍTEZ SUÁREZ RÍOS CÁRDENAS GÁLVEZ QUIÑÓNEZ ÁVILA BELTRÁN " +
 "ALCÁNTARA MONTOYA").split(" ").forEach(w => { const s = sinAcento(w); if (s !== w) ACENTOS[s] = w; });
function sinAcento(s) { return s.normalize("NFD").replace(/[̀-ͯ]/g, ""); }
function titulo(s) { return s.toLocaleLowerCase("es-MX").replace(/(^|[\s(–-])([a-záéíóúñü])/g, (m, a, b) => a + b.toLocaleUpperCase("es-MX")); }
function aplicarLista(t) { return t.replace(/[A-ZÁÉÍÓÚÑÜ]+/g, w => ACENTOS[w] || w); }
async function revisarOrtografia() {
  const campos = [];
  for (const ev of state.eventos) for (const c of ["evento", "responsable", "nota"]) { const v = limpiar(ev[c]); if (v) campos.push({ ev, campo: c, antes: v, despues: aplicarLista(v) }); }
  
  try {
    let texto = "", pos = [];
    for (const f of campos) { pos.push(texto.length); texto += titulo(f.despues) + "\n\n"; }
    const matches = token ? await api("ortografia", texto) : [];
    
    const porCampo = campos.map(() => []);
    for (const m of matches || []) {
      const i = pos.findIndex((p, k) => m.offset >= p && m.offset < (k + 1 < pos.length ? pos[k + 1] : texto.length));
      if (i < 0) continue;
      const orig = texto.substr(m.offset, m.length);
      
      if (sinAcento(orig) !== orig) continue;
      const rep = (m.reemplazos || []).find(r => sinAcento(r).toUpperCase() === orig.toUpperCase() && sinAcento(r) !== r);
      if (rep) porCampo[i].push({ off: m.offset - pos[i], len: m.length, rep: rep.toLocaleUpperCase("es-MX") });
    }
    campos.forEach((f, i) => {
      let s = f.despues;
      porCampo[i].sort((a, b) => b.off - a.off).forEach(c => { s = s.slice(0, c.off) + c.rep + s.slice(c.off + c.len); });
      f.despues = s;
    });

  return campos.filter(f => f.despues !== f.antes);
}
let pendingFixes = [];

function validar() {
